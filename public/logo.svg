<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="npBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#700070" />
      <stop offset="50%" stop-color="#4A1B9D" />
      <stop offset="100%" stop-color="#2D0B66" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="npGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E5A700" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="npShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F0326" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Crisp 1px Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#npBgGrad)" stroke="#8A2BE2" stroke-width="2" stroke-opacity="0.3" filter="url(#npShadow)" />

  <!-- Subtle Internal Grid Matrix Overlay (Fintech Precision Aesthetic) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="80" x2="432" y2="80" />
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="240" x2="432" y2="240" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="80" y1="400" x2="432" y2="400" />

    <line x1="80" y1="80" x2="80" y2="432" />
    <line x1="160" y1="80" x2="160" y2="432" />
    <line x1="240" y1="80" x2="240" y2="432" />
    <line x1="320" y1="80" x2="320" y2="432" />
    <line x1="400" y1="80" x2="400" y2="432" />
  </g>

  <!-- Architectural 'N' Monogram: Intersecting Geometric Payment Pillars -->
  <!-- Left Pillar -->
  <path d="M 128 368 L 128 144 C 128 135.16 135.16 128 144 128 L 180 128 C 188.84 128 196 135.16 196 144 L 196 368 C 196 376.84 188.84 384 180 384 L 144 384 C 135.16 384 128 376.84 128 368 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Diagonal Gateway Bridge -->
  <path d="M 172 138 L 340 374 C 344.8 380.8 353 384 360.8 384 L 372 384 C 381 384 386.6 374 381.8 366.4 L 213.8 130.4 C 209 123.6 200.8 120 193 120 L 181.8 120 C 172.8 120 167.2 130 172 138 Z" fill="#F8FAFC" />

  <!-- Right Pillar (Golden Ray) -->
  <path d="M 316 368 L 316 144 C 316 135.16 323.16 128 332 128 L 368 128 C 376.84 128 384 135.16 384 144 L 384 368 C 384 376.84 376.84 384 368 384 L 332 384 C 323.16 384 316 376.84 316 368 Z" fill="url(#npGoldGrad)" />

  <!-- Fintech Dynamic QR Sync Orbit (Precision Dots) -->
  <circle cx="162" cy="162" r="14" fill="url(#npGoldGrad)" />
  <circle cx="350" cy="350" r="14" fill="#FFFFFF" />
  <rect x="238" y="238" width="36" height="36" rx="10" transform="rotate(45 256 256)" fill="url(#npGoldGrad)" stroke="#4A1B9D" stroke-width="4" />
</svg>
