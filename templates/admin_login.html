<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternum Master Admin — NirvaPay</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="card-solid max-w-md w-full p-8 bg-slate-950 border border-purple-900/40 shadow-2xl rounded-2xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-3">
                <div class="w-10 h-10 rounded-xl bg-purple-900 flex items-center justify-center text-yellow-400 font-black text-xl border border-purple-500 shadow-lg shadow-purple-950/50">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
            <h1 class="text-xl font-extrabold text-white tracking-tight">Aeternum Master Admin</h1>
            <p class="text-xs text-purple-300/80 mt-1 font-mono">Control Center & Gateway Aggregator</p>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-300 uppercase mb-1">Email Administrator</label>
                <input type="email" id="admin-email" required value="admin@nirvapay.dasrams.biz.id" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-yellow-400 font-mono text-sm">
            </div>

            <div>
                <label class="block font-bold text-slate-300 uppercase mb-1">Master Password</label>
                <input type="password" id="admin-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-yellow-400 font-mono text-sm">
            </div>

            <div id="admin-login-error" class="hidden p-3 bg-rose-950/80 border border-rose-800 text-rose-300 rounded-lg text-xs font-semibold"></div>

            <button type="submit" id="btn-admin-login" class="w-full py-3 bg-gradient-to-r from-purple-800 to-purple-950 hover:from-purple-700 hover:to-purple-900 text-yellow-400 font-bold border border-yellow-400/30 rounded-xl text-sm shadow-lg active:scale-95 transition-all">
                <i class="fa-solid fa-lock-open mr-1.5"></i> Masuk ke Panel Master
            </button>
        </form>

        <div class="pt-6 border-t border-slate-800 text-center text-xs text-slate-500 mt-6">
            Bukan Administrator? <a href="/login" class="font-bold text-yellow-400 hover:underline">Login Merchant Biasa</a>
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-admin-login');
            const errDiv = document.getElementById('admin-login-error');
            errDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memverifikasi Master Key...`;

            const payload = {
                email: document.getElementById('admin-email').value.trim(),
                password: document.getElementById('admin-password').value,
            };

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (data.success) {
                    if (!data.is_admin) {
                        errDiv.textContent = 'Akun ini bukan akun Administrator!';
                        errDiv.classList.remove('hidden');
                    } else {
                        window.location.href = '/admin';
                    }
                } else {
                    errDiv.textContent = data.message || 'Kredensial salah';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.textContent = 'Terjadi kesalahan jaringan';
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-lock-open mr-1.5"></i> Masuk ke Panel Master`;
            }
        }
    </script>
</body>
</html>
