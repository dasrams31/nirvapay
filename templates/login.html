<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Console — NirvaPay</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="card-solid max-w-md w-full p-8 bg-white border border-slate-200 shadow-xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2.5 mb-3">
                <img src="/static/logo.svg" alt="NirvaPay Logo" class="w-10 h-10 rounded-xl shadow-md">
                <span class="text-2xl font-black text-slate-950">Nirva<span class="text-purple-800">Pay</span></span>
            </a>
            <h1 class="text-lg font-bold text-slate-900">Masuk ke Console Merchant</h1>
            <p class="text-xs text-slate-500 mt-1">Kelola mutasi, QRIS, dan integrasi API pembayaran toko Anda</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 uppercase mb-1">Email Merchant</label>
                <input type="email" id="login-email" required placeholder="nama@tokoanda.com" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700 text-sm">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block font-bold text-slate-700 uppercase">Password</label>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700 text-sm">
            </div>

            <div id="login-error" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs font-semibold"></div>

            <button type="submit" id="btn-login" class="btn-purple w-full py-3 text-sm shadow-md">
                Masuk ke Dashboard
            </button>
        </form>

        <div class="pt-6 border-t border-slate-200 text-center text-xs text-slate-500 mt-6">
            Belum punya akun merchant? <a href="/register" class="font-bold text-purple-700 hover:text-purple-900">Daftar Sekarang</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errDiv = document.getElementById('login-error');
            errDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memverifikasi...`;

            const payload = {
                email: document.getElementById('login-email').value.trim(),
                password: document.getElementById('login-password').value,
            };

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errDiv.textContent = data.message || 'Email atau password salah';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.textContent = 'Terjadi kesalahan jaringan';
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Masuk ke Dashboard`;
            }
        }
    </script>
</body>
</html>
