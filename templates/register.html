<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Merchant — NirvaPay</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="card-solid max-w-lg w-full p-8 bg-white border border-slate-200 shadow-xl">
        <!-- Logo -->
        <div class="text-center mb-6">
            <a href="/" class="inline-flex items-center gap-2.5 mb-2">
                <img src="/static/logo.svg" alt="NirvaPay Logo" class="w-9 h-9 rounded-xl shadow-md">
                <span class="text-2xl font-black text-slate-950">Nirva<span class="text-purple-800">Pay</span></span>
            </a>
            <h1 class="text-base font-bold text-slate-900">Buka Akun Merchant Baru</h1>
            <p class="text-xs text-slate-500 mt-0.5">Mulai terima pembayaran QRIS otomatis untuk toko online Anda</p>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-3.5 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1">Nama Bisnis / Toko</label>
                    <input type="text" id="reg-business-name" required placeholder="Contoh: Maju Jaya Store" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1">Nama Pemilik</label>
                    <input type="text" id="reg-owner-name" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1">Email</label>
                    <input type="email" id="reg-email" required placeholder="owner@tokoonline.com" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1">No. WhatsApp / HP</label>
                    <input type="tel" id="reg-phone" placeholder="081234567890" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700">
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 uppercase mb-1">Password Baru</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:border-purple-700">
            </div>

            <div>
                <label class="block font-bold text-slate-700 uppercase mb-1">String QRIS Statis Merchant (Opsional)</label>
                <textarea id="reg-static-qris" rows="2" placeholder="000201010211... (Bisa diisi nanti di settings)" class="w-full px-3 py-2 border border-slate-300 rounded-lg mono text-[11px] text-slate-900 focus:outline-none focus:border-purple-700"></textarea>
            </div>

            <div id="reg-error" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs font-semibold"></div>

            <button type="submit" id="btn-reg" class="btn-purple w-full py-2.5 text-xs shadow-md">
                Daftar & Dapatkan API Keys
            </button>
        </form>

        <div class="pt-5 border-t border-slate-200 text-center text-xs text-slate-500 mt-5">
            Sudah punya akun? <a href="/login" class="font-bold text-purple-700 hover:text-purple-900">Masuk di Sini</a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-reg');
            const errDiv = document.getElementById('reg-error');
            errDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses Pendaftaran...`;

            const payload = {
                business_name: document.getElementById('reg-business-name').value.trim(),
                owner_name: document.getElementById('reg-owner-name').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                phone_number: document.getElementById('reg-phone').value.trim(),
                password: document.getElementById('reg-password').value,
                static_qris_payload: document.getElementById('reg-static-qris').value.trim() || null,
            };

            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errDiv.textContent = data.message || 'Pendaftaran gagal';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.textContent = 'Terjadi kesalahan jaringan';
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Daftar & Dapatkan API Keys`;
            }
        }
    </script>
</body>
</html>
